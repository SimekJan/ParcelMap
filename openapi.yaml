
openapi: 3.0.3

info:
  title: ParcelMap
  version: 1.0.0
  description: API for retrieving parcel details and geometries from a CUZK database.
  contact:
    email: TBD@email.eu
  license:
    name: "TBD"
    url: "https://example.com/license"
  termsOfService: "https://example.com/terms"

tags:
  - name: Parcels
    description: Parcel related endpoints
  - name: Municipalities
    description: Municipality related endpoints

security:
  - BearerAuth: [ ]

paths:
  /municipalities:
    get:
      tags: [ Municipalities ]
      summary: Get municipality geometries
      operationId: getMunicipalities
      responses:
        '200':
          description: Municipality names and geometries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Municipality'

  /parcels:
    get:
      tags: [ Parcels ]
      summary: Get parcels within bounding box
      operationId: getParcels
      parameters:
        - name: bbox
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: number
            minItems: 4
            maxItems: 4
          description: minX,minY,maxX,maxY
      responses:
        '200':
          description: Parcel details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parcel'

components:
  schemas:
    Municipality:
      type: object
      required:
        - municipalityName
        - geometry
      properties:
        municipalityName:
          type: string
        geometry:
          type: string
          description: GML MultiSurface geometry
    Parcel:
      type: object
      required:
        - parcelNumber
        - municipalityName
        - area
        - zoning
        - geometry
      properties:
        parcelNumber:
          type: string
        municipalityName:
          type: string
        area:
          type: string
        zoning:
          type: string
        geometry:
          type: string
          description: GML geometry for the parcel
